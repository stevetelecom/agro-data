name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Vérifier la syntaxe Python
        run: python -m compileall backend simulator ai scripts

      - name: Lancer les tests
        run: |
          cd backend
          pytest -q

  dashboard:
    name: Tests dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Lancer les tests JavaScript
        run: node --test dashboard/js/*.test.js

  demonstration:
    name: Démonstration de bout en bout
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Démarrer l'API sur une base neuve
        run: |
          cd backend
          DATABASE_URL="sqlite:///${{ runner.temp }}/ci.db" \
            DATA_LAKE_DIR="${{ runner.temp }}/data_lake" \
            python -m uvicorn app.main:app --port 8011 --log-level warning &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8011/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "L'API n'a pas démarré" >&2
          exit 1

      - name: Rejouer la démonstration
        run: AGRO_API_BASE=http://127.0.0.1:8011 python scripts/demo_e2e.py

  audit-dependances:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    # Informationnel : une vulnérabilité amont ne doit pas bloquer la livraison,
    # mais elle doit être visible dans l'onglet Actions.
    continue-on-error: true
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pip-audit
        run: python -m pip install pip-audit

      - name: Auditer les dépendances épinglées
        run: pip-audit -r backend/requirements.txt
