<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGRO-DATA : Maquette interactive</title>
<!-- Maquette de démonstration (données simulées, aucun backend). Conception : MOD-B1 / B2 -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,300..700,0..1&display=swap" rel="stylesheet">
<style>
:root{--brun:#8B4A2B;--brun-f:#3E2219;--brun-m:#5A3020;--or:#C8873A;--creme:#F0DDC0;--fond:#F7F1E8;--carte:#fff;--encre:#2B1A12;--gris:#7A5C48;--bord:#E2D6CC;--ok:#4F7F3A;--mod:#C8873A;--ko:#A63D2F;--ombre:0 10px 28px rgba(62,34,25,.10);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fond:#1E120D;--carte:#2B1A12;--encre:#F5E9DA;--gris:#C9AE98;--bord:#4A2E22;--creme:#3A2419;--color-scheme:dark;color-scheme:dark}}
:root[data-theme="dark"]{--fond:#1E120D;--carte:#2B1A12;--encre:#F5E9DA;--gris:#C9AE98;--bord:#4A2E22;--creme:#3A2419;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Poppins,system-ui,sans-serif;background:var(--fond);color:var(--encre);font-size:14px}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:22px;line-height:1;vertical-align:middle;display:inline-block;font-feature-settings:"liga"}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}
/* Connexion */
#login{min-height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#8B4A2B 0,#3E2219 55%,#241209 100%)}
.box{background:var(--carte);border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.4);width:100%;max-width:400px;padding:34px 30px}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo i{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--brun),var(--or));display:grid;place-items:center;color:#fff}
.logo b{font-size:19px;color:var(--brun);display:block;line-height:1.1}.logo small{color:var(--gris);font-size:11px;letter-spacing:1px}
h1{font-size:20px;margin-bottom:4px}.sous{color:var(--gris);font-size:13px;margin-bottom:20px}
label{font-size:12px;font-weight:600;color:var(--gris);display:block;margin:12px 0 5px}
.champ{position:relative}
input,select{width:100%;padding:11px 14px;border:1.5px solid var(--bord);border-radius:12px;font:inherit;background:var(--carte);color:var(--encre);outline:none}
input:focus,select:focus{border-color:var(--brun);box-shadow:0 0 0 3px rgba(200,135,58,.25)}
.champ button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--gris)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:none;border-radius:12px;font-weight:600;font-size:13.5px;background:linear-gradient(135deg,var(--brun),#6E3820);color:#fff;transition:.2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.bl{width:100%;margin-top:20px}.btn.sec{background:var(--creme);color:var(--brun)}.btn.ko{background:var(--ko)}
.note{font-size:11.5px;color:var(--gris);margin-top:14px;text-align:center}
.err{color:var(--ko);font-size:12px;margin-top:8px;min-height:16px}
/* Application */
#app{display:flex;min-height:100%}
aside{width:236px;background:linear-gradient(180deg,#4A2618,#2E160D);color:#F5E9DA;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;padding:18px 12px;z-index:20}
aside .logo{padding:0 6px}aside .logo b{color:#fff}aside .logo small{color:#D9B99A}
aside nav{flex:1;margin-top:8px}
aside nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;margin:3px 0;border:none;border-radius:11px;background:none;color:#EBD9C5;font-size:13px;font-weight:500;text-align:left}
aside nav button:hover{background:rgba(255,255,255,.09)}
aside nav button.on{background:rgba(255,255,255,.15);box-shadow:inset 3px 0 0 var(--or);color:#fff}
.user{display:flex;gap:10px;align-items:center;padding:12px 6px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
.user i{width:36px;height:36px;border-radius:50%;background:var(--or);color:#2B1A12;display:grid;place-items:center;font-style:normal;font-weight:700}
main{flex:1;margin-left:236px;min-width:0}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--carte) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--bord);padding:13px 24px;display:flex;align-items:center;gap:12px}
header h2{font-size:17px;color:var(--brun)}header .sp{flex:1}
.ib{border:1px solid var(--bord);background:var(--carte);color:var(--encre);border-radius:11px;padding:8px}
.vue{padding:22px 24px;max-width:1200px}
.grille{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:16px}
.card{background:var(--carte);border:1px solid var(--bord);border-radius:16px;padding:18px;box-shadow:var(--ombre)}
.kpi{display:flex;gap:14px;align-items:center}
.kpi .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--creme);color:var(--brun)}
.kpi small{color:var(--gris);font-size:12px}.kpi b{font-size:25px;display:block;line-height:1.15}
.card h3{font-size:14px;margin-bottom:4px}.card .sub{font-size:11.5px;color:var(--gris);margin-bottom:12px}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11.5px;font-weight:600;color:#fff}
.ok{background:var(--ok)}.mod{background:var(--mod)}.ko{background:var(--ko)}
svg text{fill:var(--gris);font-size:10px;font-family:Poppins}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{text-align:left;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--gris);padding:10px;border-bottom:2px solid var(--bord)}
td{padding:11px 10px;border-bottom:1px solid var(--bord)}tr:hover td{background:color-mix(in srgb,var(--creme) 50%,transparent)}
.barre{height:7px;background:var(--bord);border-radius:9px;overflow:hidden;min-width:70px}.barre i{display:block;height:100%;border-radius:9px}
.outils{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.outils input{max-width:300px}
.mini{border:none;background:var(--creme);color:var(--brun);border-radius:9px;padding:6px;margin-right:4px}.mini.d{color:var(--ko)}
/* Modal + toast */
.fond{position:fixed;inset:0;background:rgba(30,15,8,.55);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--carte);border-radius:18px;padding:24px;width:100%;max-width:440px;animation:in .25s}
@keyframes in{from{transform:translateY(14px);opacity:0}}
.modal h3{color:var(--brun);margin-bottom:6px;font-size:16px}.modal .ligne{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
#toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px}
.t{background:var(--brun-f);color:#fff;padding:12px 16px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--ombre);border-left:4px solid var(--or);animation:in .3s}
.drop{border:2px dashed var(--or);border-radius:16px;padding:30px;text-align:center;color:var(--gris);background:var(--creme)}
.cabosse{width:100%;height:150px;border-radius:14px;background:radial-gradient(circle at 35% 40%,#6b3a1d 0 16%,transparent 17%),radial-gradient(circle at 62% 58%,#3d1f10 0 11%,transparent 12%),linear-gradient(135deg,#d9a441,#b9772b);position:relative;margin-bottom:12px}
/* Producteur zéro-texte */
.zt{max-width:460px;margin:0 auto;text-align:center}
.feu{width:190px;height:190px;border-radius:50%;margin:10px auto 22px;display:grid;place-items:center;color:#fff;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.feu .ms{font-size:96px}
.gros{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gros button{border:none;border-radius:20px;padding:24px 10px;background:var(--carte);border:2px solid var(--bord);color:var(--brun);transition:.2s}
.gros button:hover{border-color:var(--or);transform:translateY(-2px)}.gros .ms{font-size:52px;display:block;margin-bottom:6px}
.gros b{font-size:20px}
.tel{max-width:420px;margin:0 auto}
@media(max-width:820px){aside{position:static;width:100%;flex-direction:row;align-items:center;padding:8px;overflow-x:auto;inset:auto}aside .logo small,aside .user,aside .logo b{display:none}aside .logo{margin:0}aside nav{display:flex;margin:0}aside nav button{width:auto;white-space:nowrap}#app{flex-direction:column}main{margin-left:0}.vue{padding:16px}}
</style>
</head>
<body>

<!-- Page de connexion (PB-12) -->
<section id="login">
  <div class="box">
    <div class="logo"><i><span class="ms">spa</span></i><div><b>AGRO-DATA</b><small>DONNÉES CACAO · AMBAM</small></div></div>
    <h1>Connexion</h1><p class="sous">Accédez à votre espace abonné.</p>
    <label for="u">Adresse e-mail</label><input id="u" type="email" value="acheteur@ebolowa.cm">
    <label for="p">Mot de passe</label>
    <div class="champ"><input id="p" type="password" value="demo1234"><button type="button" id="oeil" aria-label="Afficher le mot de passe"><span class="ms">visibility</span></button></div>
    <div class="err" id="err"></div>
    <button class="btn bl" id="go"><span class="ms">login</span>Se connecter</button>
    <p class="note">Prototype : tout identifiant non vide est accepté.</p>
  </div>
</section>

<!-- Application -->
<div id="app" class="hide">
  <aside>
    <div class="logo"><i><span class="ms">spa</span></i><div><b>AGRO-DATA</b><small>DAAS CACAO</small></div></div>
    <nav id="nav">
      <button data-v="dash" class="on"><span class="ms">space_dashboard</span>Tableau de bord</button>
      <button data-v="plots"><span class="ms">grass</span>Parcelles</button>
      <button data-v="diag"><span class="ms">photo_camera</span>Diagnostic IA</button>
      <button data-v="prod"><span class="ms">smartphone</span>Vue producteur</button>
      <button data-v="api"><span class="ms">api</span>API REST</button>
    </nav>
    <div class="user"><i>A</i><div><b>Acheteur Ebolowa</b><br><span style="color:#D9B99A">Abonnement actif</span></div></div>
  </aside>
  <main>
    <header>
      <h2 id="titre">Tableau de bord</h2><span class="sp"></span>
      <button class="ib" id="theme" aria-label="Thème"><span class="ms">contrast</span></button>
      <button class="ib" id="out" aria-label="Déconnexion"><span class="ms">logout</span></button>
    </header>
    <div class="vue" id="vue"></div>
  </main>
</div>
<div id="toast"></div>

<script>
/* ===== Données simulées (contrat JSON, section 12 du cahier) ===== */
let parcelles=[
 {id:1,nom:"Parcelle Nkoulou",village:"Ambam centre",ha:3.2,h:62,ia:0.55},
 {id:2,nom:"Parcelle Ntem Nord",village:"Ntem",ha:5.0,h:20,ia:0.18},
 {id:3,nom:"Parcelle Mvila",village:"Ma’an",ha:2.4,h:0,ia:0.05},
 {id:4,nom:"Parcelle Akom",village:"Ambam est",ha:4.1,h:49,ia:0.30}
];
let nextId=5, filtre="";
const $=s=>document.querySelector(s);
/* RM2 : indice = 60 x min(1, h/48) + 40 x taux IA */
const indice=p=>Math.round(60*Math.min(1,p.h/48)+40*p.ia);
const niveau=i=>i<30?["Faible","ok","var(--ok)"]:i<=60?["Modéré","mod","var(--mod)"]:["Élevé","ko","var(--ko)"];
const moy=()=>Math.round(parcelles.reduce((a,p)=>a+indice(p),0)/(parcelles.length||1));
function toast(m){const t=document.createElement("div");t.className="t";t.innerHTML='<span class="ms">check_circle</span>'+m;$("#toast").append(t);setTimeout(()=>t.remove(),3200)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ===== Connexion ===== */
$("#oeil").onclick=()=>{const p=$("#p"),s=p.type==="password";p.type=s?"text":"password";$("#oeil .ms").textContent=s?"visibility_off":"visibility"};
$("#go").onclick=()=>{if(!$("#u").value.trim()||!$("#p").value){$("#err").textContent="Identifiants requis.";return}
 $("#login").classList.add("hide");$("#app").classList.remove("hide");show("dash")};
$("#out").onclick=()=>{$("#app").classList.add("hide");$("#login").classList.remove("hide")};
$("#theme").onclick=()=>{const r=document.documentElement;const d=getComputedStyle(r).colorScheme==="dark";r.dataset.theme=d?"light":"dark"};

/* ===== Navigation ===== */
const titres={dash:"Tableau de bord",plots:"Parcelles",diag:"Diagnostic IA",prod:"Vue producteur",api:"API REST"};
$("#nav").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.v)};
function show(v){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 $("#titre").textContent=titres[v];$("#vue").innerHTML="";views[v]();window.scrollTo(0,0)}

/* ===== Graphique SVG simple ===== */
function ligne(series,{min,max,seuil,w=520,h=210,unit=""}){
 const x=i=>36+i*(w-50)/(series[0].d.length-1),y=v=>h-26-(v-min)/(max-min)*(h-44);
 let s=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img">`;
 for(let k=0;k<=4;k++){const v=min+k*(max-min)/4;s+=`<line x1="36" x2="${w-14}" y1="${y(v)}" y2="${y(v)}" stroke="var(--bord)"/><text x="4" y="${y(v)+3}">${Math.round(v)}${unit}</text>`}
 if(seuil!=null)s+=`<line x1="36" x2="${w-14}" y1="${y(seuil)}" y2="${y(seuil)}" stroke="var(--ko)" stroke-dasharray="5 4"/><text x="${w-110}" y="${y(seuil)-5}" style="fill:var(--ko)">Seuil ${seuil}${unit}</text>`;
 series.forEach(S=>{s+=`<polyline fill="none" stroke="${S.c}" stroke-width="2.6" stroke-linejoin="round" ${S.dash?'stroke-dasharray="6 4"':""} points="${S.d.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`});
 ["J-6","J-5","J-4","J-3","J-2","J-1","Auj."].forEach((l,i)=>{if(series[0].d.length===7)s+=`<text x="${x(i)-9}" y="${h-8}">${l}</text>`});
 return s+"</svg>"}

const views={
dash(){
 const m=moy(),n=niveau(m),al=parcelles.filter(p=>p.h>=48).length;
 const hum=[78,80,83,86,88,87,89],hum2=[72,74,73,75,76,74,75];
 $("#vue").innerHTML=`
 <div class="grille g4">
  <div class="card kpi"><div class="ic"><span class="ms">bug_report</span></div><div><small>Indice d’Infestation Global</small><b>${m}/100</b><span class="pill ${n[1]}">${n[0]}</span></div></div>
  <div class="card kpi"><div class="ic"><span class="ms">water_drop</span></div><div><small>Humidité moyenne (air)</small><b>83 %</b><small>+4 pts sur 7 jours</small></div></div>
  <div class="card kpi"><div class="ic"><span class="ms">notifications_active</span></div><div><small>Alertes actives</small><b>${al}</b><small>humidité > 85 % pendant 48 h</small></div></div>
  <div class="card kpi"><div class="ic"><span class="ms">inventory_2</span></div><div><small>Volume sain estimé</small><b>${Math.max(20,100-Math.round(m*0.7))} %</b><small>horizon 7 jours</small></div></div>
 </div>
 <div class="grille g2">
  <div class="card"><h3>Évolution de l’humidité de l’air</h3><div class="sub">Parcelle sous alerte (brun) et parcelle saine (vert), 7 jours</div>${ligne([{d:hum,c:"var(--brun)"},{d:hum2,c:"var(--ok)"}],{min:60,max:100,seuil:85,unit:" %"})}</div>
  <div class="card"><h3>Courbe de prix prédictive (FCFA/kg)</h3><div class="sub">Courbe de démonstration, coefficients à calibrer (ICCO, CICC)</div>${ligne([{d:[1050,1060,1055,1070,1065,1080,1085],c:"var(--gris)",dash:1},{d:[1050,1065,1070,1100,1120,1160,1185],c:"var(--or)"}],{min:1000,max:1250})}<div class="sub" style="margin-top:6px">Pointillé : prix de référence. Plein : ajusté selon l’indice.</div></div>
 </div>
 <div class="card" style="margin-top:16px"><h3>Parcelles à surveiller</h3><div class="sub">Classées par indice décroissant</div><div class="scroll"><table><tr><th>Parcelle</th><th>Village</th><th>Indice</th><th>Niveau</th></tr>
 ${[...parcelles].sort((a,b)=>indice(b)-indice(a)).slice(0,3).map(p=>{const i=indice(p),l=niveau(i);return`<tr><td><b>${esc(p.nom)}</b></td><td>${esc(p.village)}</td><td><div class="barre"><i style="width:${i}%;background:${l[2]}"></i></div></td><td><span class="pill ${l[1]}">${l[0]} · ${i}</span></td></tr>`}).join("")}</table></div></div>`},

plots(){
 $("#vue").innerHTML=`<div class="outils"><input id="q" placeholder="Rechercher une parcelle ou un village" value="${esc(filtre)}"><span style="flex:1"></span><button class="btn" id="add"><span class="ms">add</span>Nouvelle parcelle</button></div>
 <div class="card"><div class="scroll"><table id="tb"></table></div></div>`;
 $("#q").oninput=e=>{filtre=e.target.value;lister()};$("#add").onclick=()=>form();lister()},

diag(){
 $("#vue").innerHTML=`<div class="grille g2" style="margin-top:0"><div class="card"><h3>Analyser une cabosse</h3><div class="sub">POST /api/v1/diagnostic · modèle MobileNetV2 (preuve de concept)</div>
  <div class="drop" id="dz"><span class="ms" style="font-size:44px;color:var(--brun)">add_a_photo</span><p>Glissez une photo ou cliquez pour utiliser une image d’exemple</p></div></div>
  <div class="card" id="res"><h3>Résultat</h3><div class="sub">En attente d’une image.</div></div></div>`;
 $("#dz").onclick=()=>{$("#res").innerHTML=`<h3>Résultat</h3><div class="sub">Analyse terminée (valeurs simulées)</div><div class="cabosse"></div>
  <p><span class="pill ko">Pourriture brune détectée</span></p><p style="margin:12px 0 5px;font-size:12px">Score de confiance : <b>87 %</b></p><div class="barre"><i style="width:87%;background:var(--ko)"></i></div>
  <p class="sub" style="margin-top:12px">Recommandation : pulvérisation ciblée sur la parcelle concernée.</p>`;toast("Diagnostic terminé")}},

prod(){
 const n=niveau(moy());const ic=n[1]==="ok"?"sentiment_satisfied":n[1]==="mod"?"warning":"dangerous";
 $("#vue").innerHTML=`<div class="zt"><p class="sub">Interface « zéro-texte » : une tâche en moins de 60 secondes (PB-15)</p>
 <div class="feu" style="background:${n[2]}"><span class="ms">${ic}</span></div>
 <div class="gros"><button id="z1"><span class="ms">water_drop</span><b>${Math.round(65+moy()/4)} %</b></button><button id="z2"><span class="ms">thermostat</span><b>27 °C</b></button>
 <button id="z3"><span class="ms">volume_up</span><b>Écouter</b></button><button id="z4"><span class="ms">call</span><b>Appeler</b></button></div></div>`;
 $("#z3").onclick=()=>toast("Lecture vocale de l’alerte (simulation)");$("#z4").onclick=()=>toast("Appel du conseiller agricole (simulation)")},

api(){
 const rows=[["POST","/api/v1/auth/login","Connexion"],["POST","/api/v1/measurements","Ingestion d’une mesure"],["GET","/api/v1/kpis","Indicateurs"],["GET","/api/v1/prices/forecast","Prix prédictif"],["CRUD","/api/v1/plots","Parcelles"],["POST","/api/v1/diagnostic","Diagnostic IA"]];
 $("#vue").innerHTML=`<div class="card"><h3>Intégrez les données à vos outils</h3><div class="sub">Clé d’API personnelle, limitation de débit</div>
 <div class="champ"><input readonly value="agro_live_••••••••••••••••" id="k"><button id="cp" aria-label="Copier"><span class="ms">content_copy</span></button></div>
 <div class="scroll" style="margin-top:14px"><table>${rows.map(r=>`<tr><td><span class="pill ${r[0]==="GET"?"ok":"mod"}">${r[0]}</span></td><td><code>${r[1]}</code></td><td>${r[2]}</td></tr>`).join("")}</table></div></div>`;
 $("#cp").onclick=()=>toast("Clé copiée")}
};

/* ===== Tableau CRUD ===== */
function lister(){
 const l=parcelles.filter(p=>(p.nom+p.village).toLowerCase().includes(filtre.toLowerCase()));
 $("#tb").innerHTML=`<tr><th>Parcelle</th><th>Village</th><th>Surface</th><th>H > 85 %</th><th>Indice</th><th></th></tr>`+
 (l.map(p=>{const i=indice(p),n=niveau(i);return`<tr><td><b>${esc(p.nom)}</b></td><td>${esc(p.village)}</td><td>${p.ha} ha</td><td>${p.h} h</td><td><span class="pill ${n[1]}">${n[0]} · ${i}</span></td>
 <td><button class="mini" data-e="${p.id}" aria-label="Modifier"><span class="ms">edit</span></button><button class="mini d" data-s="${p.id}" aria-label="Supprimer"><span class="ms">delete</span></button></td></tr>`}).join("")||`<tr><td colspan="6">Aucun résultat.</td></tr>`);
 $("#tb").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.e)form(parcelles.find(p=>p.id==b.dataset.e));
  if(b.dataset.s)confirmer(parcelles.find(p=>p.id==b.dataset.s))}}
function modal(h){const f=document.createElement("div");f.className="fond";f.innerHTML=`<div class="modal">${h}</div>`;f.onclick=e=>{if(e.target===f)f.remove()};document.body.append(f);return f}
function form(p){
 const e=!!p;p=p||{nom:"",village:"",ha:1,h:0,ia:0};
 const f=modal(`<h3>${e?"Modifier":"Nouvelle"} parcelle</h3>
 <label>Nom</label><input id="f1" maxlength="40" value="${esc(p.nom)}"><label>Village</label><input id="f2" maxlength="40" value="${esc(p.village)}">
 <div class="ligne"><div><label>Surface (ha)</label><input id="f3" type="number" min="0.1" step="0.1" value="${p.ha}"></div><div><label>Heures > 85 %</label><input id="f4" type="number" min="0" max="168" value="${p.h}"></div></div>
 <label>Taux de détection IA (%)</label><input id="f5" type="number" min="0" max="100" value="${Math.round(p.ia*100)}">
 <div class="err" id="fe"></div><div class="acts"><button class="btn sec" id="c">Annuler</button><button class="btn" id="ok"><span class="ms">save</span>Enregistrer</button></div>`);
 f.querySelector("#c").onclick=()=>f.remove();
 f.querySelector("#ok").onclick=()=>{
  const d={nom:f.querySelector("#f1").value.trim(),village:f.querySelector("#f2").value.trim(),ha:+f.querySelector("#f3").value,h:+f.querySelector("#f4").value,ia:+f.querySelector("#f5").value/100};
  if(!d.nom||!d.village||!(d.ha>0)||d.h<0||d.h>168||d.ia<0||d.ia>1){f.querySelector("#fe").textContent="Vérifiez les champs (plages invalides).";return}
  if(e)Object.assign(p,d);else parcelles.push({id:nextId++,...d});
  f.remove();lister();toast(e?"Parcelle modifiée":"Parcelle créée")}}
function confirmer(p){
 const f=modal(`<h3>Supprimer cette parcelle ?</h3><p class="sub">${esc(p.nom)} sera retirée de la liste.</p><div class="acts"><button class="btn sec" id="c">Annuler</button><button class="btn ko" id="ok"><span class="ms">delete</span>Supprimer</button></div>`);
 f.querySelector("#c").onclick=()=>f.remove();
 f.querySelector("#ok").onclick=()=>{parcelles=parcelles.filter(x=>x!==p);f.remove();lister();toast("Parcelle supprimée")}}
</script>
</body>
</html>
