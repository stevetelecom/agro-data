<!DOCTYPE html>
<!-- TailleurPro : maquette interactive (données fictives, aucun backend). Écrans 3 à 11 du cahier des charges. -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TailleurPro : maquette interactive</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=DM+Sans:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL@24,400,0" rel="stylesheet">
<style>
/* Palette cacao, reprise du pitch (chocolat, brun, caramel, vert feuille) */
:root{--ch:#2A160F;--br:#8B4A2B;--ca:#C8883C;--ve:#4E7D3B;--rg:#B03A2E;--fond:#FAF7F4;--carte:#fff;--txt:#2A160F;--mut:#7A6358;--bd:#E7DDD5;--cr:#F2EDE8;--side:#2A160F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--fond:#1B0F0A;--carte:#2A1913;--txt:#F3E9E1;--mut:#B9A396;--bd:#3E2A21;--cr:#34221A;--side:#150B07}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}body{font:16px/1.5 'DM Sans',sans-serif;background:var(--fond);color:var(--txt)}
h1,h2,h3{font-family:Fraunces,serif;font-weight:700}
.ic{font-family:'Material Symbols Rounded';font-size:22px;vertical-align:middle;line-height:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:3px solid var(--ca);outline-offset:2px}
/* Barre latérale (4 entrées max, ENF-U9) */
.side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--side);color:#F3E9E1;padding:20px 14px;display:flex;flex-direction:column;gap:6px;z-index:5}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 18px}.logo i{background:var(--ca);color:var(--ch);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.logo b{font:700 19px Fraunces,serif;display:block;line-height:1.1}.logo small{color:#C9B3A4;font-size:12px}
.nav{display:flex;align-items:center;gap:12px;padding:12px;border:0;background:none;border-radius:12px;color:#E5D3C6;text-align:left;min-height:44px}
.nav:hover{background:#ffffff14}.nav.on{background:#ffffff1f;box-shadow:inset 3px 0 var(--ca);color:#fff}
.who{margin-top:auto;font-size:13px;color:#C9B3A4;padding:10px 8px;border-top:1px solid #ffffff20}
main{margin-left:236px;padding:26px 30px 60px;max-width:1180px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:30px}.top p{color:var(--mut)}
.btn{display:inline-flex;gap:8px;align-items:center;min-height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--bd);background:var(--carte);font-weight:700}
.btn.p{background:var(--br);border-color:var(--br);color:#fff}.btn.p:hover{background:var(--ch)}.btn.v{background:var(--ve);border-color:var(--ve);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--carte);border:1px solid var(--bd);border-radius:16px;padding:16px;border-left:5px solid var(--ca)}
.kpi.r{border-left-color:var(--rg)}.kpi.g{border-left-color:var(--ve)}.kpi.b{border-left-color:var(--br)}
.kpi span{color:var(--mut);font-size:14px}.kpi b{display:block;font:700 28px Fraunces,serif}
.card{background:var(--carte);border:1px solid var(--bd);border-radius:16px;padding:18px;overflow-x:auto}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select,.f input,.f select,.f textarea{min-height:44px;padding:8px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--carte);width:100%}
.tools input{flex:1;min-width:180px}.tools select{width:auto}
table{width:100%;border-collapse:collapse;min-width:520px}th{text-align:left;font-size:14px;color:var(--mut);padding:8px 10px;border-bottom:2px solid var(--bd);cursor:pointer}
td{padding:12px 10px;border-bottom:1px solid var(--bd)}tbody tr{cursor:pointer;transition:background .15s}tbody tr:hover{background:var(--cr)}
.bd{display:inline-flex;gap:4px;align-items:center;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--cr);color:var(--br)}
.bd.Prête{background:#E3EFDC;color:#2F5A20}.bd.Livrée{background:#E6E2DE;color:#5E524B}.bd.Annulée,.bd.late{background:#F7DEDA;color:var(--rg)}.bd.soon{background:#FBE9CF;color:#8A5410}.bd.Nouvelle{background:#E4E9F2;color:#33507F}.bd.En.cours{background:#F6E6CF;color:#8A5410}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.empty{padding:30px;text-align:center;color:var(--mut)}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--carte);color:var(--txt);box-shadow:0 30px 80px #0006}
dialog::backdrop{background:#2A160Fb3;backdrop-filter:blur(3px)}dialog[open]{animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--ch);color:#fff;border-radius:20px 20px 0 0}.mh h2{font-size:21px}
.mh button{background:none;border:0;color:#fff;min-width:44px;min-height:44px}.mb{padding:20px;display:grid;gap:14px}
.f label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}.f small{color:var(--mut)}.err{color:var(--rg);font-size:14px;min-height:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.solde{display:flex;justify-content:space-between;align-items:center;background:var(--cr);padding:12px 16px;border-radius:12px}.solde b{font:700 22px Fraunces,serif}
.wa{background:#E3EFDC;border-radius:14px;padding:14px;white-space:pre-wrap;border-left:4px solid var(--ve)}
.warn{background:#FBE9CF;color:#6B3F08;padding:10px 14px;border-radius:12px}
#toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ch);color:#fff;padding:12px 18px;border-radius:12px;display:flex;gap:8px;align-items:center;transform:translateY(90px);opacity:0;transition:.3s;z-index:99;border-left:5px solid var(--ve)}#toast.on{transform:none;opacity:1}
/* Mobile 360 px : navigation en barre basse */
@media(max-width:820px){.side{inset:auto 0 0 0;width:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}.logo,.who{display:none}.nav{flex-direction:column;gap:0;font-size:12px;padding:6px 8px;text-align:center}
main{margin:0;padding:18px 14px 100px}.kpis{grid-template-columns:1fr 1fr}.grid2,.row{grid-template-columns:1fr}.mes{grid-template-columns:1fr 1fr}.hm{display:none}.top h1{font-size:25px}#toast{left:14px;right:14px;bottom:90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside class="side">
 <div class="logo"><i class="ic">content_cut</i><div><b>TailleurPro</b><small>Atelier Ndongo</small></div></div>
 <button class="nav on" data-v="home"><span class="ic">home</span>Accueil</button>
 <button class="nav" data-v="orders"><span class="ic">receipt_long</span>Commandes</button>
 <button class="nav" data-v="clients"><span class="ic">group</span>Clients</button>
 <button class="nav" data-v="settings"><span class="ic">settings</span>Paramètres</button>
 <div class="who">Données fictives de démonstration</div>
</aside>
<main id="app"></main>
<dialog id="m"></dialog>
<div id="toast" role="status"><span class="ic">check_circle</span><span id="tt"></span></div>
<script>
"use strict";
/* ---------- Utilitaires ---------- */
const DAY=864e5,T0=new Date().setHours(0,0,0,0);
// Échappement systématique de toute donnée affichée (protection XSS)
const e=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>n.toLocaleString("fr-FR").replace(/\u202f|\u00a0/g," ")+" FCFA";
const dfr=t=>new Date(t).toLocaleDateString("fr-FR");
const $=s=>document.querySelector(s),m=$("#m");
/* ---------- Données fictives ---------- */
const MK=["poitrine","taille","hanches","épaule","manche","longueur robe"];
let clients=[
{id:1,nom:"Aïcha Mballa",tel:"+237 677 123 456",mes:[92,74,100,38,60,110]},
{id:2,nom:"Grâce Etoundi",tel:"+237 699 765 432",mes:[88,70,96,37,58,105]},
{id:3,nom:"Brice Nkomo",tel:"+237 655 987 001",mes:[104,90,102,46,64,0]},
{id:4,nom:"Sandrine Fotso",tel:"+237 670 222 118",mes:[96,78,104,39,59,115]},
{id:5,nom:"Paul Ateba",tel:"+237 690 454 780",mes:[100,86,98,45,63,0]}];
let orders=[
["Kaba",1,-2,45000,[20000],"En cours","Kaba wax bleu, col rond"],["Robe",2,0,30000,[15000],"En cours","Robe de soirée"],
["Costume",3,1,85000,[40000],"En cours","Costume trois pièces"],["Boubou",5,2,60000,[60000],"Prête","Boubou brodé"],
["Robe",4,5,38000,[10000],"Nouvelle","Robe de mariage, témoin"],["Chemise",3,9,18000,[0],"Nouvelle","Chemise lin"],
["Jupe",1,-6,15000,[15000],"Livrée","Jupe crayon"],["Kaba",2,3,52000,[25000],"En cours","Kaba dentelle"]
].map((o,i)=>({id:"CMD-"+String(i+1).padStart(4,"0"),type:o[0],c:o[1],liv:T0+o[2]*DAY,prix:o[3],pay:o[4].filter(Boolean),st:o[5],desc:o[6]}));
let atelier={nom:"Atelier Ndongo",tel:"+237 677 000 111",ville:"Ambam, quartier Nkoleton",
 tpl:"Bonjour {nom}, votre commande {num} est prête. Solde à payer : {solde}. {atelier}, {ville}."};
const cl=id=>clients.find(c=>c.id===id),od=id=>orders.find(o=>o.id===id);
const paid=o=>o.pay.reduce((a,b)=>a+b,0),solde=o=>o.prix-paid(o);          // RG1
const days=o=>Math.round((o.liv-T0)/DAY),open_=o=>!["Livrée","Annulée"].includes(o.st);
const late=o=>open_(o)&&days(o)<0,soon=o=>open_(o)&&days(o)>=0&&days(o)<=2; // RG4, EF-D6
const badges=o=>`<span class="bd ${o.st}">${o.st}</span>`+(late(o)?` <span class="bd late"><span class="ic" style="font-size:15px">schedule</span>En retard</span>`:soon(o)?` <span class="bd soon">Bientôt</span>`:"");
function toast(t){$("#tt").textContent=t;const x=$("#toast");x.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>x.classList.remove("on"),2600)}
/* ---------- Vues ---------- */
let view="home",sortAsc=true,q="",fs="";
const V={
home(){const a=orders.filter(open_),enc=orders.filter(o=>o.st!=="Annulée").reduce((s,o)=>s+solde(o),0);
 return `<div class="top"><div><h1>Bonjour, Atelier Ndongo</h1><p>${new Date(T0).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p></div>
 <button class="btn p" data-a="newOrder"><span class="ic">add</span>Nouvelle commande</button></div>
 <div class="kpis"><div class="kpi"><span>À livrer aujourd’hui</span><b>${a.filter(o=>days(o)===0).length}</b></div>
 <div class="kpi r"><span>En retard</span><b>${a.filter(late).length}</b></div>
 <div class="kpi g"><span>Prêtes, non retirées</span><b>${orders.filter(o=>o.st==="Prête").length}</b></div>
 <div class="kpi b"><span>Reste à encaisser</span><b>${fmt(enc)}</b></div></div>
 <div class="card"><h3 style="margin-bottom:10px">À livrer en priorité</h3>${tbl(a.sort((x,y)=>x.liv-y.liv).slice(0,5))}</div>`},
orders(){let l=orders.filter(o=>(!fs||o.st===fs)&&(cl(o.c).nom+o.id).toLowerCase().includes(q.toLowerCase())).sort((x,y)=>sortAsc?x.liv-y.liv:y.liv-x.liv);
 return `<div class="top"><h1>Commandes</h1><button class="btn p" data-a="newOrder"><span class="ic">add</span>Nouvelle commande</button></div>
 <div class="card"><div class="tools"><input id="q" placeholder="Rechercher un client ou un numéro" value="${e(q)}" aria-label="Recherche">
 <select id="fs" aria-label="Filtrer par statut"><option value="">Tous les statuts</option>${["Nouvelle","En cours","Prête","Livrée","Annulée"].map(s=>`<option ${fs===s?"selected":""}>${s}</option>`).join("")}</select></div>${tbl(l,1)}</div>`},
clients(){const l=clients.filter(c=>(c.nom+c.tel).toLowerCase().includes(q.toLowerCase()));
 return `<div class="top"><h1>Clients</h1><button class="btn p" data-a="newClient"><span class="ic">person_add</span>Nouveau client</button></div>
 <div class="card"><div class="tools"><input id="q" placeholder="Rechercher par nom ou téléphone" value="${e(q)}" aria-label="Recherche"></div>
 <table><thead><tr><th>Nom</th><th>Téléphone</th><th>Commandes</th><th>Reste dû</th></tr></thead><tbody>${l.map(c=>{const os=orders.filter(o=>o.c===c.id&&o.st!=="Annulée");
 return `<tr data-a="client" data-id="${c.id}"><td><b>${e(c.nom)}</b></td><td>${e(c.tel)}</td><td>${os.length}</td><td>${fmt(os.reduce((s,o)=>s+solde(o),0))}</td></tr>`}).join("")||`<tr><td colspan=4 class="empty">Aucun client trouvé. Essayez un autre nom.</td></tr>`}</tbody></table></div>`},
settings(){return `<div class="top"><h1>Paramètres</h1></div><div class="grid2"><form class="card f" id="fa" style="display:grid;gap:12px"><h3>Profil de l’atelier</h3>
 <div><label>Nom</label><input name="nom" maxlength=60 required value="${e(atelier.nom)}"></div><div><label>Téléphone</label><input name="tel" value="${e(atelier.tel)}"></div>
 <div><label>Quartier / ville</label><input name="ville" maxlength=80 value="${e(atelier.ville)}"></div><button class="btn p" style="justify-self:start">Enregistrer</button></form>
 <form class="card f" id="ft" style="display:grid;gap:12px"><h3>Message « commande prête »</h3><div><label>Modèle</label><textarea name="tpl" rows=5 maxlength=300>${e(atelier.tpl)}</textarea>
 <small>Variables : {nom} {num} {solde} {atelier} {ville}</small></div><button class="btn p" style="justify-self:start">Enregistrer le modèle</button></form></div>`}};
function tbl(l,sort){return `<table><thead><tr><th>N°</th><th>Client</th><th class="hm">Vêtement</th><th ${sort?`data-a="sort"`:""}>Livraison${sort?` <span class="ic" style="font-size:16px">${sortAsc?"arrow_upward":"arrow_downward"}</span>`:""}</th><th>Statut</th><th class="hm">Solde</th></tr></thead><tbody>
 ${l.map(o=>`<tr data-a="order" data-id="${o.id}"><td><b>${o.id}</b></td><td>${e(cl(o.c).nom)}</td><td class="hm">${o.type}</td><td>${dfr(o.liv)}</td><td>${badges(o)}</td><td class="hm">${solde(o)?fmt(solde(o)):'<span class="bd Prête">Soldé</span>'}</td></tr>`).join("")||`<tr><td colspan=6 class="empty">Aucune commande. Créez la première avec « Nouvelle commande ».</td></tr>`}</tbody></table>`}
function render(){$("#app").innerHTML=V[view]();document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("on",b.dataset.v===view))}
/* ---------- Modales (toutes les actions CRUD) ---------- */
const mod=(t,b)=>{m.innerHTML=`<div class="mh"><h2>${t}</h2><button data-a="x" aria-label="Fermer"><span class="ic">close</span></button></div><div class="mb">${b}</div>`;if(!m.open)m.showModal()};
const A={
x(){m.close()},sort(){sortAsc=!sortAsc;render()},
order(id){const o=od(id),c=cl(o.c),nx={Nouvelle:"En cours","En cours":"Prête",Prête:"Livrée"}[o.st];
 mod(o.id+" · "+e(c.nom),`<div>${badges(o)}</div><p>${o.type} : ${e(o.desc)}<br>Livraison le <b>${dfr(o.liv)}</b> · Prix <b>${fmt(o.prix)}</b></p>
 <div class="solde"><span>Solde restant</span><b>${fmt(solde(o))}</b></div>
 <div><b>Acomptes</b>${o.pay.map((p,i)=>`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)"><span>Acompte ${i+1}</span><span>${fmt(p)}</span></div>`).join("")||'<p class="empty">Aucun acompte enregistré.</p>'}</div>
 ${open_(o)&&solde(o)>0?`<form class="f row" data-f="pay" data-id="${o.id}"><input name="p" type="number" min="1" max="${solde(o)}" placeholder="Montant en FCFA" required aria-label="Montant de l’acompte"><button class="btn v">Ajouter l’acompte</button></form><div class="err" id="er"></div>`:""}
 ${o.warn?`<div class="warn">Il reste ${fmt(solde(o))} à payer. Confirmez la livraison malgré le solde.</div>`:""}
 <div style="display:flex;gap:10px;flex-wrap:wrap">${nx?`<button class="btn p" data-a="next" data-id="${o.id}">Passer à « ${nx} »</button>`:""}${o.st==="Prête"?`<button class="btn v" data-a="msg" data-id="${o.id}"><span class="ic">send</span>Prévenir le client</button>`:""}${open_(o)?`<button class="btn" data-a="cancel" data-id="${o.id}">Annuler la commande</button>`:""}</div>`)},
next(id){const o=od(id);if(o.st==="Prête"&&solde(o)>0&&!o.warn){o.warn=1;return A.order(id)}  // EF-E6
 o.st={Nouvelle:"En cours","En cours":"Prête",Prête:"Livrée"}[o.st];o.warn=0;render();toast("Statut mis à jour : "+o.st);o.st==="Prête"?A.msg(id):A.order(id)},
cancel(id){od(id).st="Annulée";render();A.x();toast("Commande annulée")},
msg(id){const o=od(id),c=cl(o.c),t=atelier.tpl.replace("{nom}",c.nom).replace("{num}",o.id).replace("{solde}",fmt(solde(o))).replace("{atelier}",atelier.nom).replace("{ville}",atelier.ville),
 n=c.tel.replace(/\D/g,"");mod("Prévenir le client",`<p>Aperçu du message pour <b>${e(c.nom)}</b></p><div class="wa">${e(t)}</div>
 <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn v" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent(t)}"><span class="ic">chat</span>Ouvrir WhatsApp</a>
 <a class="btn" href="sms:${n}?body=${encodeURIComponent(t)}"><span class="ic">sms</span>Envoyer par SMS</a></div><small style="color:var(--mut)">Rien n’est envoyé sans votre action.</small>`)},
newOrder(){mod("Nouvelle commande",`<form class="f" data-f="order" style="display:grid;gap:12px"><div><label>Client</label><select name="c">${clients.map(c=>`<option value="${c.id}">${e(c.nom)}</option>`).join("")}</select></div>
 <div class="row"><div><label>Vêtement</label><select name="t">${["Robe","Kaba","Boubou","Chemise","Pantalon","Costume","Jupe","Autre"].map(t=>`<option>${t}</option>`).join("")}</select></div>
 <div><label>Date de livraison</label><input type="date" name="d" min="${new Date(T0).toISOString().slice(0,10)}" required></div></div>
 <div><label>Description</label><input name="s" maxlength=120 placeholder="Ex. kaba wax, col rond"></div>
 <div class="row"><div><label>Prix total (FCFA)</label><input type="number" name="p" min="1" max="5000000" required></div><div><label>Acompte (FCFA)</label><input type="number" name="a" min="0" value="0"></div></div>
 <div class="row"><div><label>Photo du tissu</label><input type="file" accept="image/jpeg,image/png,image/webp"></div><div><label>Photo du modèle</label><input type="file" accept="image/jpeg,image/png,image/webp"></div></div>
 <div class="err" id="er"></div><button class="btn p">Enregistrer la commande</button></form>`)},
newClient(){mod("Nouveau client",`<form class="f" data-f="client" style="display:grid;gap:12px"><div><label>Nom</label><input name="n" maxlength=60 required></div>
 <div><label>Téléphone</label><input name="t" placeholder="+237 6XX XXX XXX" required><small>Format : +237 suivi de 9 chiffres</small></div>
 <label style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" name="ok" style="width:22px;min-height:22px"> Le client accepte l’enregistrement de ses mesures et de ses données.</label>
 <div class="err" id="er"></div><button class="btn p">Créer le client</button></form>`)},
client(id){const c=cl(+id),os=orders.filter(o=>o.c===c.id);
 mod(e(c.nom),`<p>${e(c.tel)}</p><form class="f" data-f="mes" data-id="${c.id}" style="display:grid;gap:12px"><b><span class="ic">straighten</span> Mesures actives (cm)</b>
 <div class="mes">${MK.map((k,i)=>`<div><label>${k}</label><input type="number" name="m${i}" min="10" max="250" value="${c.mes[i]||""}"></div>`).join("")}</div>
 <div class="err" id="er"></div><button class="btn p">Enregistrer les mesures</button></form>
 <b>Historique</b>${os.map(o=>`<div style="display:flex;justify-content:space-between"><span>${o.id} · ${o.type}</span>${badges(o)}</div>`).join("")||'<p class="empty">Aucune commande pour ce client.</p>'}`)}
};
/* ---------- Soumissions de formulaires : validation côté client (ENF-S4) ---------- */
document.addEventListener("submit",ev=>{ev.preventDefault();const f=ev.target,d=Object.fromEntries(new FormData(f)),er=$("#er"),bad=t=>{if(er)er.textContent=t};
 if(f.dataset.f==="pay"){const o=od(f.dataset.id),p=+d.p;if(!(p>0&&p<=solde(o)))return bad("Le montant doit être compris entre 1 et "+fmt(solde(o))+"."); // RG2
  o.pay.push(p);render();toast("Acompte enregistré");A.order(o.id)}
 else if(f.dataset.f==="order"){const p=+d.p,a=+d.a||0,t=new Date(d.d+"T00:00:00").getTime();
  if(!(t>=T0))return bad("La date de livraison ne peut pas être passée.");if(a>p)return bad("L’acompte dépasse le prix total.");  // RG5, RG2
  orders.push({id:"CMD-"+String(orders.length+1).padStart(4,"0"),c:+d.c,type:d.t,desc:d.s||"Sans description",liv:t,prix:p,pay:a?[a]:[],st:"Nouvelle"});render();A.x();toast("Commande créée")}
 else if(f.dataset.f==="client"){const n=d.n.trim(),t=d.t.trim();if(!n)return bad("Le nom est obligatoire.");
  if(!/^\+237 ?6\d{2} ?\d{3} ?\d{3}$/.test(t))return bad("Téléphone invalide. Exemple : +237 677 123 456.");
  if(clients.some(c=>c.tel.replace(/\s/g,"")===t.replace(/\s/g,"")))return bad("Ce numéro existe déjà dans l’atelier.");  // RG7
  if(!d.ok)return bad("Le consentement du client est obligatoire.");clients.push({id:Date.now(),nom:n,tel:t,mes:[]});render();A.x();toast("Client créé")}
 else if(f.dataset.f==="mes"){const c=cl(+f.dataset.id),v=MK.map((k,i)=>+d["m"+i]||0);if(v.some(x=>x&&(x<10||x>250)))return bad("Chaque mesure doit être entre 10 et 250 cm.");
  c.mes=v;A.x();toast("Mesures enregistrées")}
 else if(f.id==="fa"){Object.assign(atelier,{nom:d.nom.trim()||atelier.nom,tel:d.tel,ville:d.ville});toast("Profil enregistré")}
 else if(f.id==="ft"){atelier.tpl=d.tpl;toast("Modèle enregistré")}});
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a],[data-v]");if(!b)return;
 if(b.dataset.v){view=b.dataset.v;q="";fs="";render();return}A[b.dataset.a](b.dataset.id)});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){q=ev.target.value;const p=ev.target.selectionStart;render();const i=$("#q");i.focus();i.setSelectionRange(p,p)}});
document.addEventListener("change",ev=>{if(ev.target.id==="fs"){fs=ev.target.value;render()}});
render();
